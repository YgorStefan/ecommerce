# docker-compose.yml
# Orquestra todos os serviços da aplicação: banco de dados, backend e frontend
# Modo: PRODUÇÃO — usa as imagens buildadas pelo Dockerfile multi-stage
#
# Banco de dados: MySQL (o backend usa TypeORM com driver mysql2 — ver backend/src/app.module.ts)
# Observação: em produção real (Railway) o banco costuma ser provisionado como serviço
# gerenciado à parte, com DB_HOST/DB_PORT apontando para ele — o serviço "mysql" abaixo
# é útil para rodar a stack completa localmente via `docker compose up`.

services:
  # Serviço do banco de dados MySQL
  mysql:
    image: mysql:8.0
    container_name: ecommerce_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ecommerce123}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce_db}
      MYSQL_USER: ${DB_USER:-ecommerce}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce123}
    ports:
      - '3308:3306'
    volumes:
      # Persiste os dados do banco entre reinicializações do container
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_PASSWORD:-ecommerce123}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Serviço do backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # BUILD_DATE invalida o cache de forma controlada: muda a cada build disparado
      # pelo Makefile/CI, mas não afeta o cache de npm ci (que depende de package.json).
      # Isso garante que o código-fonte seja sempre recopiado sem reinstalar deps.
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        GIT_HASH: ${GIT_HASH:-unknown}
    # pull_policy: build força o Docker a usar a imagem buildada localmente,
    # nunca tentando puxar do registry quando não existe tag de registry configurada.
    pull_policy: build
    container_name: ecommerce_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    depends_on:
      mysql:
        condition: service_healthy

  # Serviço do frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        GIT_HASH: ${GIT_HASH:-unknown}
    pull_policy: build
    container_name: ecommerce_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # URL usada pelo browser do cliente (deve ser acessível externamente)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      # URL interna usada por Server Components do Next.js dentro da rede Docker
      - INTERNAL_API_URL=http://backend:3001
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      - backend

# Volumes nomeados para persistência de dados
volumes:
  mysql_data:
    driver: local
